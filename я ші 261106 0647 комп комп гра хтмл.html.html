         <!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Неоновий футбол — 99 квадратів</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#05060a; }
  canvas { display:block; position:fixed; inset:0; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
'use strict';

/* ============================================================
   КОНСТАНТИ
   ============================================================ */
const BALL_R     = 13;                       // радіус жовтого м'яча
const PLAYER_R   = 36;                       // радіус червоного / синього
const GOAL_R     = 95;                       // радіус кутових воріт
const BALL_MIN   = 400;                      // мінімальна швидкість м'яча
const BALL_MAX   = 500;                      // максимальна швидкість м'яча
const PLAYER_MAX = 333;                      // максимальна швидкість гравця
const PLAYER_ROT = Math.PI / 180;            // 1° за секунду
const SQ_ROT     = 10 * Math.PI / 180;       // 10° за секунду
const SECTORS    = 11;                       // секторів на гравцеві
const SQ_COUNT   = 99;                       // квадратів у центрі

/* ============================================================
   УТИЛІТИ
   ============================================================ */
const rand  = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
const lightColor = () =>
  'hsl(' + Math.floor(rand(0, 360)) + ',100%,' + Math.floor(rand(62, 88)) + '%)';

/* ============================================================
   СТАН
   ============================================================ */
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');

let W = 1, H = 1;
let ball, red, blue;
let squares  = [];
let scoreRed = 0, scoreBlue = 0;
let state    = 'play';   // 'play' | 'pause'
let pauseT   = 0;
let labels   = [];       // плаваючі очки

/* ============================================================
   РОЗМІР ПОЛОТНА
   ============================================================ */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(320, window.innerWidth);
  H = Math.max(240, window.innerHeight);
  canvas.width  = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* ============================================================
   СТВОРЕННЯ ГРАВЦЯ
   11 секторів — кожен зі своїм кольором, ±5% швидкості,
   ±5° кута + випадкове продовження до 50°.
   Все рахується ОДИН РАЗ на початку гри і тримається в пам'яті.
   ============================================================ */
function makePlayer(side) {           // side: -1 = червоний (ліво), +1 = синій (право)
  const sectors = [];
  for (let i = 0; i < SECTORS; i++) {
    sectors.push({
      color:    'hsl(' + Math.floor(rand(0, 360)) + ',95%,' + Math.floor(rand(50, 68)) + '%)',
      speedMul: 0.95 + Math.random() * 0.10,                       // ±5%
      angleOff: (Math.random() * 2 - 1) * 5  * Math.PI / 180       // ±5°
              + (Math.random() * 2 - 1) * 50 * Math.PI / 180       // ±50° продовження
    });
  }
  return {
    side,
    x: 0, y: 0, vx: 0, vy: 0,
    angle: Math.random() * Math.PI * 2,
    sectors,
    flash: 0
  };
}

/* ============================================================
   99 КВАДРАТІВ У ЦЕНТРАЛЬНІЙ ТРЕТИНІ
   ============================================================ */
function buildSquares() {
  squares = [];
  const rw = W / 3, rh = H / 3;
  const x0 = W / 2 - rw / 2, y0 = H / 2 - rh / 2;
  for (let i = 0; i < SQ_COUNT; i++) {
    squares.push({
      x: x0 + Math.random() * rw,
      y: y0 + Math.random() * rh,
      s: rand(5, 11),                                  // пів-сторона
      a: Math.random() * Math.PI * 2,                  // випадковий кут
      color: 'hsl(' + Math.floor(rand(175, 320)) + ',100%,' + Math.floor(rand(45, 72)) + '%)'
    });
  }
}

/* ============================================================
   ПЛАВАЮЧІ ОЧКИ
   ============================================================ */
function makeLabels() {
  labels = [
    { side: -1, x: 90,     y: 80, vx: 0, vy: 0, color: lightColor(), t: 0 },
    { side:  1, x: W - 90, y: 80, vx: 0, vy: 0, color: lightColor(), t: 0 }
  ];
  for (const l of labels) {
    const a = rand(0, Math.PI * 2);
    const s = rand(35, 75);
    l.vx = Math.cos(a) * s;
    l.vy = Math.sin(a) * s;
  }
}

/* ============================================================
   ІНІЦІАЛІЗАЦІЯ
   ============================================================ */
function initGame() {
  scoreRed = 0;
  scoreBlue = 0;
  red  = makePlayer(-1);
  blue = makePlayer( 1);
  ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, r: BALL_R };
  buildSquares();
  makeLabels();
  state = 'play';
  pauseT = 0;
  resetPositions();
}

/* м'яч у центр, гравці — на центри задніх ліній */
function resetPositions() {
  red.x  = PLAYER_R + 14;
  red.y  = H / 2;
  red.vx = red.vy = 0;

  blue.x  = W - PLAYER_R - 14;
  blue.y  = H / 2;
  blue.vx = blue.vy = 0;

  ball.x = W / 2;
  ball.y = H / 2;
  const a  = Math.random() * Math.PI * 2;
  const sp = rand(430, 490);
  ball.vx = Math.cos(a) * sp;
  ball.vy = Math.sin(a) * sp;
}

/* ============================================================
   ФІЗИКА: М'ЯЧ
   ============================================================ */
function collideWalls(b) {
  if (b.x < b.r)      { b.x = b.r;      b.vx =  Math.abs(b.vx); }
  if (b.x > W - b.r)  { b.x = W - b.r;  b.vx = -Math.abs(b.vx); }
  if (b.y < b.r)      { b.y = b.r;      b.vy =  Math.abs(b.vy); }
  if (b.y > H - b.r)  { b.y = H - b.r;  b.vy = -Math.abs(b.vy); }
}

/* м'яч проти повернутого квадрата — ПРАВИЛЬНИЙ відбій */
function collideSquare(b, sq) {
  const cos = Math.cos(sq.a), sin = Math.sin(sq.a);
  const dx = b.x - sq.x, dy = b.y - sq.y;

  // світ -> локальні координати квадрата
  const lx =  dx * cos + dy * sin;
  const ly = -dx * sin + dy * cos;
  const h  = sq.s;

  let nx, ny, pen;

  if (Math.abs(lx) < h && Math.abs(ly) < h) {
    // центр м'яча всередині — виштовхуємо по найближчій грані
    const ex = h - Math.abs(lx);
    const ey = h - Math.abs(ly);
    if (ex < ey) { nx = Math.sign(lx) || 1; ny = 0; pen = ex + b.r; }
    else         { nx = 0; ny = Math.sign(ly) || 1; pen = ey + b.r; }
  } else {
    const px = clamp(lx, -h, h);
    const py = clamp(ly, -h, h);
    nx = lx - px;
    ny = ly - py;
    const d = Math.hypot(nx, ny);
    if (d > b.r || d < 1e-9) return;
    nx /= d; ny /= d;
    pen = b.r - d;
  }

  // локаль -> світ
  const wnx = nx * cos - ny * sin;
  const wny = nx * sin + ny * cos;

  b.x += wnx * pen;
  b.y += wny * pen;

  const dot = b.vx * wnx + b.vy * wny;
  if (dot < 0) {
    b.vx -= 2 * dot * wnx;
    b.vy -= 2 * dot * wny;
  }
}

/* м'яч проти гравця — НЕПРАВИЛЬНИЙ відбій через сектор */
function collidePlayer(b, p) {
  const dx = b.x - p.x, dy = b.y - p.y;
  const dist = Math.hypot(dx, dy);
  const minD = b.r + PLAYER_R;
  if (dist >= minD || dist < 1e-6) return;

  const nx = dx / dist, ny = dy / dist;

  // який сектор зачепили
  let ang = Math.atan2(dy, dx) - p.angle;
  ang = ((ang % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  const idx = Math.floor(ang / (Math.PI * 2 / SECTORS)) % SECTORS;
  const mod = p.sectors[idx];

  // виштовхування
  b.x = p.x + nx * (minD + 0.5);
  b.y = p.y + ny * (minD + 0.5);

  const dot = b.vx * nx + b.vy * ny;
  if (dot >= 0) return;             // м'яч уже відлітає — не відбиваємо

  // звичайний відбій
  let vx = b.vx - 2 * dot * nx;
  let vy = b.vy - 2 * dot * ny;

  // + кут сектора
  const ca = Math.cos(mod.angleOff), sa = Math.sin(mod.angleOff);
  const rx = vx * ca - vy * sa;
  const ry = vx * sa + vy * ca;

  // + швидкість сектора
  let sp = Math.hypot(rx, ry) * mod.speedMul;
  sp = clamp(sp, BALL_MIN, BALL_MAX);

  const l = Math.hypot(rx, ry) || 1;
  b.vx = rx / l * sp;
  b.vy = ry / l * sp;

  p.flash = 0.25;
}

/* перевірка голу: кути екрана */
function checkGoal() {
  const corners = [
    { x: 0, y: 0, red: true  }, { x: 0, y: H, red: true  },   // червоні кути
    { x: W, y: 0, red: false }, { x: W, y: H, red: false }    // сині кути
  ];
  for (const c of corners) {
    if (Math.hypot(ball.x - c.x, ball.y - c.y) < GOAL_R) {
      if (c.red) scoreBlue += 1;      // синій забив у червоний кут
      else       scoreRed  += 1;      // червоний забив у синій кут
      state  = 'pause';
      pauseT = 1.0;
      return true;
    }
  }
  return false;
}

/* рух м'яча з підкроками (щоб не пролітав крізь квадрати) */
function moveBall(dt) {
  const sp = Math.hypot(ball.vx, ball.vy) || 1;
  const steps = Math.max(1, Math.ceil(sp * dt / 3));
  const sdt = dt / steps;

  for (let i = 0; i < steps; i++) {
    ball.x += ball.vx * sdt;
    ball.y += ball.vy * sdt;

    if (checkGoal()) return;

    collideWalls(ball);
    for (let j = 0; j < squares.length; j++) collideSquare(ball, squares[j]);
    collidePlayer(ball, red);
    collidePlayer(ball, blue);
  }

  // страховка: швидкість завжди 400..500
  const s = Math.hypot(ball.vx, ball.vy);
  if (s > 1e-6 && (s < BALL_MIN || s > BALL_MAX)) {
    const t = clamp(s, BALL_MIN, BALL_MAX);
    ball.vx = ball.vx / s * t;
    ball.vy = ball.vy / s * t;
  }
}

/* ============================================================
   ШІ ГРАВЦІВ
   ============================================================ */

/* куди м'яч прилетить на лінії targetX (з відбиттям від верх/низ) */
function predictBallY(targetX, maxT) {
  maxT = maxT || 2.5;
  let x = ball.x, y = ball.y, vx = ball.vx, vy = ball.vy;
  if (Math.abs(vx) < 1) return null;
  const dir = Math.sign(targetX - x);
  if (Math.sign(vx) !== dir) return null;

  const step = 1 / 180;
  let t = 0;
  while (t < maxT) {
    x += vx * step;
    y += vy * step;
    t += step;
    if (y < BALL_R)          { y = BALL_R + (BALL_R - y);            vy = -vy; }
    else if (y > H - BALL_R) { y = H - BALL_R - (y - (H - BALL_R));  vy = -vy; }
    if (dir > 0 ? x >= targetX : x <= targetX) return y;
  }
  return null;
}

/* позиція, з якої відбій піде точно в кут суперника */
function aimPosition(p) {
  const corners = p.side < 0
    ? [{ x: W, y: 0 }, { x: W, y: H }]
    : [{ x: 0, y: 0 }, { x: 0, y: H }];

  let best = corners[0], bd = Infinity;
  for (const c of corners) {
    const d = Math.hypot(c.x - ball.x, c.y - ball.y);
    if (d < bd) { bd = d; best = c; }
  }

  let dx = best.x - ball.x, dy = best.y - ball.y;
  const dl = Math.hypot(dx, dy) || 1;
  dx /= dl; dy /= dl;

  let vx = ball.vx, vy = ball.vy;
  const vl = Math.hypot(vx, vy) || 1;
  vx /= vl; vy /= vl;

  // нормаль відбію: n = normalize(v - d)
  let nx = vx - dx, ny = vy - dy;
  const nl = Math.hypot(nx, ny);
  if (nl < 1e-3) return null;
  nx /= nl; ny /= nl;

  // обираємо той бік, з якого м'яч НАБЛИЖАЄТЬСЯ
  if (vx * nx + vy * ny > 0) { nx = -nx; ny = -ny; }

  const D = BALL_R + PLAYER_R + 3;
  return { x: ball.x - nx * D, y: ball.y - ny * D };
}

function updatePlayer(p, dt) {
  // обертання 1°/с
  p.angle += PLAYER_ROT * dt * (p.side < 0 ? 1 : -1);
  if (p.flash > 0) p.flash -= dt;

  const homeX = p.side < 0 ? PLAYER_R + 14 : W - PLAYER_R - 14;
  const homeY = H / 2;

  let tx = homeX, ty = homeY;

  const towardMe = (ball.vx * p.side) > 0;   // м'яч летить на мою половину
  const db = Math.hypot(ball.x - p.x, ball.y - p.y);

  if (towardMe) {
    // 1) ціль — задня лінія, точка перехоплення
    const py = predictBallY(homeX);
    ty = (py === null) ? ball.y : py;
    tx = homeX;

    // 2) якщо м'яч близько — стаємо так, щоб відбити в кут суперника
    if (db < 320) {
      const aim = aimPosition(p);
      if (aim) { tx = aim.x; ty = aim.y; }
    }
  } else {
    // м'яч на моїй половині й тікає — біжимо за ним
    const onMyHalf = (ball.x - W / 2) * p.side > 0;
    if (onMyHalf && db < 260) { tx = ball.x; ty = ball.y; }
  }

  // рух до цілі з розгоном
  const dx = tx - p.x, dy = ty - p.y;
  const dist = Math.hypot(dx, dy);

  let dvx = 0, dvy = 0;
  if (dist > 2) {
    const sp = Math.min(PLAYER_MAX, dist * 5);
    dvx = dx / dist * sp;
    dvy = dy / dist * sp;
  }

  const accel = 2000;
  p.vx += clamp(dvx - p.vx, -accel * dt, accel * dt);
  p.vy += clamp(dvy - p.vy, -accel * dt, accel * dt);

  const sp = Math.hypot(p.vx, p.vy);
  if (sp > PLAYER_MAX) { p.vx = p.vx / sp * PLAYER_MAX; p.vy = p.vy / sp * PLAYER_MAX; }

  p.x += p.vx * dt;
  p.y += p.vy * dt;

  // гравець не залишає свою половину
  const minX = p.side < 0 ? PLAYER_R       : W / 2 + PLAYER_R;
  const maxX = p.side < 0 ? W / 2 - PLAYER_R : W - PLAYER_R;
  if (p.x < minX) { p.x = minX; if (p.vx < 0) p.vx = 0; }
  if (p.x > maxX) { p.x = maxX; if (p.vx > 0) p.vx = 0; }
  if (p.y < PLAYER_R)     { p.y = PLAYER_R;     if (p.vy < 0) p.vy = 0; }
  if (p.y > H - PLAYER_R) { p.y = H - PLAYER_R; if (p.vy > 0) p.vy = 0; }
}

/* ============================================================
   ОНОВЛЕННЯ
   ============================================================ */
function updateLabels(dt) {
  for (const l of labels) {
    l.x += l.vx * dt;
    l.y += l.vy * dt;
    const m = 70;
    if (l.x < m)      { l.x = m;      l.vx =  Math.abs(l.vx); }
    if (l.x > W - m)  { l.x = W - m;  l.vx = -Math.abs(l.vx); }
    if (l.y < m)      { l.y = m;      l.vy =  Math.abs(l.vy); }
    if (l.y > H - m)  { l.y = H - m;  l.vy = -Math.abs(l.vy); }

    l.t -= dt;
    if (l.t <= 0) { l.t = rand(0.25, 0.6); l.color = lightColor(); }
  }
}

function update(dt) {
  updateLabels(dt);

  if (state === 'pause') {
    pauseT -= dt;
    if (pauseT <= 0) {
      resetPositions();
      state = 'play';
    }
    return;
  }

  // квадрати крутяться 10°/с
  for (let i = 0; i < squares.length; i++) squares[i].a += SQ_ROT * dt;

  updatePlayer(red, dt);
  updatePlayer(blue, dt);

  moveBall(dt);
}

/* ============================================================
   МАЛЮВАННЯ
   ============================================================ */
function drawGoals() {
  const g = [
    { x: 0, y: 0, a0: 0,               a1: Math.PI / 2,       c: '255,70,70'  },
    { x: 0, y: H, a0: -Math.PI / 2,    a1: 0,                 c: '255,70,70'  },
    { x: W, y: 0, a0: Math.PI / 2,     a1: Math.PI,           c: '80,130,255' },
    { x: W, y: H, a0: Math.PI,         a1: Math.PI * 1.5,     c: '80,130,255' }
  ];
  for (const c of g) {
    const grad = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, GOAL_R);
    grad.addColorStop(0,    'rgba(' + c.c + ',0.42)');
    grad.addColorStop(0.75, 'rgba(' + c.c + ',0.12)');
    grad.addColorStop(1,    'rgba(' + c.c + ',0)');

    ctx.beginPath();
    ctx.moveTo(c.x, c.y);
    ctx.arc(c.x, c.y, GOAL_R, c.a0, c.a1);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(c.x, c.y, GOAL_R, c.a0, c.a1);
    ctx.strokeStyle = 'rgba(' + c.c + ',0.75)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function drawSquares() {
  ctx.lineWidth = 1.5;
  for (let i = 0; i < squares.length; i++) {
    const sq = squares[i];
    ctx.save();
    ctx.translate(sq.x, sq.y);
    ctx.rotate(sq.a);
    ctx.strokeStyle = sq.color;
    ctx.strokeRect(-sq.s, -sq.s, sq.s * 2, sq.s * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.035)';
    ctx.fillRect(-sq.s, -sq.s, sq.s * 2, sq.s * 2);
    ctx.restore();
  }
}

function drawBall() {
  // світіння
  const g = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, BALL_R * 3.2);
  g.addColorStop(0, 'rgba(255,225,60,0.55)');
  g.addColorStop(1, 'rgba(255,225,60,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R * 3.2, 0, Math.PI * 2);
  ctx.fill();

  // жовте тіло
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
  ctx.fillStyle = '#ffd93b';
  ctx.fill();

  // менший білий круг усередині
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R * 0.5, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
}

function drawPlayer(p) {
  const isRed = p.side < 0;
  const rgb   = isRed ? '255,70,70' : '80,130,255';

  ctx.save();
  ctx.translate(p.x, p.y);

  // світіння
  const glow = ctx.createRadialGradient(0, 0, PLAYER_R * 0.5, 0, 0, PLAYER_R * 2);
  glow.addColorStop(0, 'rgba(' + rgb + ',' + (p.flash > 0 ? 0.6 : 0.25) + ')');
  glow.addColorStop(1, 'rgba(' + rgb + ',0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(0, 0, PLAYER_R * 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.rotate(p.angle);

  // тіло
  ctx.beginPath();
  ctx.arc(0, 0, PLAYER_R, 0, Math.PI * 2);
  ctx.fillStyle = isRed ? '#3a0a0a' : '#0a1440';
  ctx.fill();

  // 11 секторів від центру до половини радіуса
  const innerR = PLAYER_R * 0.5;
  const step   = (Math.PI * 2) / SECTORS;
  for (let i = 0; i < SECTORS; i++) {
    const a0 = i * step;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, innerR, a0, a0 + step);
    ctx.closePath();
    ctx.fillStyle = p.sectors[i].color;
    ctx.fill();
  }

  // поділки секторів до краю
  ctx.strokeStyle = 'rgba(255,255,255,0.13)';
  ctx.lineWidth = 1;
  for (let i = 0; i < SECTORS; i++) {
    const a0 = i * step;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a0) * innerR, Math.sin(a0) * innerR);
    ctx.lineTo(Math.cos(a0) * PLAYER_R, Math.sin(a0) * PLAYER_R);
    ctx.stroke();
  }

  // обід
  ctx.beginPath();
  ctx.arc(0, 0, PLAYER_R, 0, Math.PI * 2);
  ctx.strokeStyle = isRed ? '#ff4a4a' : '#4a7bff';
  ctx.lineWidth = 4;
  ctx.stroke();

  ctx.restore();
}

function drawScoreLabels() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const l of labels) {
    const val = l.side < 0 ? scoreRed : scoreBlue;
    ctx.font = 'bold 44px ui-monospace, Consolas, monospace';
    ctx.fillStyle = l.color;
    ctx.shadowColor = l.color;
    ctx.shadowBlur = 22;
    ctx.fillText(String(val), l.x, l.y);
    ctx.shadowBlur = 0;

    ctx.font = 'bold 13px ui-monospace, Consolas, monospace';
    ctx.fillStyle = l.side < 0 ? 'rgba(255,90,90,0.85)' : 'rgba(120,160,255,0.85)';
    ctx.fillText(l.side < 0 ? 'ЧЕРВОНИЙ' : 'СИНІЙ', l.x, l.y - 34);
  }
}

function render() {
  // фон
  ctx.fillStyle = '#070912';
  ctx.fillRect(0, 0, W, H);

  // половини поля
  ctx.fillStyle = 'rgba(255,60,60,0.045)';
  ctx.fillRect(0, 0, W / 2, H);
  ctx.fillStyle = 'rgba(60,110,255,0.045)';
  ctx.fillRect(W / 2, 0, W / 2, H);

  // центральна лінія
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W / 2, 0);
  ctx.lineTo(W / 2, H);
  ctx.stroke();

  drawGoals();
  drawSquares();
  drawBall();
  drawPlayer(red);
  drawPlayer(blue);
  drawScoreLabels();

  // пауза після голу
  if (state === 'pause') {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 56px ui-monospace, Consolas, monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 30;
    ctx.fillText('ГОЛ!', W / 2, H / 2);
    ctx.shadowBlur = 0;
  }
}

/* ============================================================
   ЦИКЛ
   ============================================================ */
let last = performance.now();

function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;      // захист від великих стрибків
  if (dt < 0)    dt = 0;

  update(dt);
  render();

  requestAnimationFrame(loop);
}

/* ============================================================
   РЕСАЙЗ
   ============================================================ */
function onResize() {
  const oldW = W, oldH = H;
  resize();
  if (!ball) { initGame(); return; }

  if (oldW > 1 && oldH > 1) {
    const sx = W / oldW, sy = H / oldH;
    ball.x *= sx; ball.y *= sy;
    red.x  *= sx; red.y  *= sy;
    blue.x *= sx; blue.y *= sy;
  }
  buildSquares();
  clampAll();
}

function clampAll() {
  ball.x = clamp(ball.x, BALL_R, W - BALL_R);
  ball.y = clamp(ball.y, BALL_R, H - BALL_R);
  red.x  = clamp(red.x,  PLAYER_R, W / 2 - PLAYER_R);
  red.y  = clamp(red.y,  PLAYER_R, H - PLAYER_R);
  blue.x = clamp(blue.x, W / 2 + PLAYER_R, W - PLAYER_R);
  blue.y = clamp(blue.y, PLAYER_R, H - PLAYER_R);
}

/* ============================================================
   СТАРТ
   ============================================================ */
resize();
initGame();
window.addEventListener('resize', onResize);
requestAnimationFrame(function (t) { last = t; loop(t); });

})();
</script>
