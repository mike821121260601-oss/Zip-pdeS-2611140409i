        <!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Збирач</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0b1026;color:#dff;
    font-family:system-ui,-apple-system,Arial,sans-serif;user-select:none}
  canvas{display:block}
  #hud{position:fixed;top:0;left:0;right:0;padding:12px 16px;display:flex;
    justify-content:space-between;font-weight:800;font-size:18px;pointer-events:none;
    text-shadow:0 2px 10px #000}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;text-align:center;padding:24px;
    background:rgba(5,8,22,.74);backdrop-filter:blur(5px);z-index:10}
  #overlay h1{font-size:clamp(26px,7vw,46px);color:#4de1ff;text-shadow:0 0 26px #0af}
  #overlay p{max-width:440px;line-height:1.55;opacity:.85;font-size:15px}
  #btn{margin-top:6px;padding:14px 36px;font-size:18px;font-weight:800;border:0;
    border-radius:999px;cursor:pointer;color:#04212b;
    background:linear-gradient(180deg,#6ff0ff,#22b8dd);box-shadow:0 8px 28px #0af8}
  #btn:active{transform:scale(.96)}
  .hide{display:none!important}
</style>
</head>
<body>

<div id="hud">
  <div>💎 <span id="score">0</span> / 25</div>
  <div id="lives">❤️❤️❤️</div>
</div>

<div id="overlay">
  <h1 id="title">3D Збирач</h1>
  <p id="text">Збирай блакитні кристали та тікай від червоних кубів.<br>
     Керування: <b>WASD</b> / стрілки, або <b>тягни пальцем / мишею</b> по екрану.</p>
  <button id="btn">Грати</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- Базове налаштування ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1026);
scene.fog = new THREE.Fog(0x0b1026, 40, 80);

const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 15, 16);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------- Світло ---------- */
scene.add(new THREE.HemisphereLight(0x9fd4ff, 0x1a1030, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(10, 22, 12);
scene.add(sun);

/* ---------- Арена ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(120, 120),
  new THREE.MeshStandardMaterial({ color: 0x1a2340, roughness: 0.95, metalness: 0.1 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const grid = new THREE.GridHelper(120, 60, 0x3f7fbf, 0x233a5c);
grid.position.y = 0.02;
grid.material.transparent = true;
grid.material.opacity = 0.55;
scene.add(grid);

const ring = new THREE.Mesh(
  new THREE.RingGeometry(23.6, 24.2, 72),
  new THREE.MeshBasicMaterial({ color: 0x4de1ff, side: THREE.DoubleSide,
    transparent: true, opacity: 0.55 })
);
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.05;
scene.add(ring);

/* ---------- Гравець ---------- */
const player = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.75, 1),
  new THREE.MeshStandardMaterial({ color: 0x6ff0ff, emissive: 0x1b6f8a,
    roughness: 0.25, metalness: 0.6 })
);
player.position.set(0, 0.75, 0);
scene.add(player);

const glow = new THREE.PointLight(0x4de1ff, 1.8, 14);
player.add(glow);

/* ---------- Кристали та вороги ---------- */
const gemGeo = new THREE.OctahedronGeometry(0.55, 0);
const gemMat = new THREE.MeshStandardMaterial({ color: 0x7fffd4, emissive: 0x1f8f6a,
  roughness: 0.2, metalness: 0.85 });

const enemyGeo = new THREE.BoxGeometry(1.1, 1.1, 1.1);
const enemyMat = new THREE.MeshStandardMaterial({ color: 0xff4d6d, emissive: 0x7a0f26,
  roughness: 0.4, metalness: 0.35 });

const GEM_COUNT = 6;
const WIN_SCORE = 25;
const MAX_ENEMIES = 6;
const SPEED = 13;

const gems = [];
const enemies = [];
let state = 'start';      // start | play | over
let score = 0, lives = 3, invuln = 0, t = 0, enemyTimer = 0;

/* ---------- Допоміжні ---------- */
function randPoint(radius) {
  const a = Math.random() * Math.PI * 2;
  const d = Math.sqrt(Math.random()) * radius;
  return new THREE.Vector3(Math.cos(a) * d, 0, Math.sin(a) * d);
}

function spawnGem() {
  const g = new THREE.Mesh(gemGeo, gemMat);
  let p;
  do { p = randPoint(21); } while (p.distanceTo(player.position) < 5);
  g.position.set(p.x, 1.0, p.z);
  g.userData.phase = Math.random() * Math.PI * 2;
  scene.add(g);
  gems.push(g);
}

function spawnEnemy() {
  const e = new THREE.Mesh(enemyGeo, enemyMat);
  const a = Math.random() * Math.PI * 2;
  e.position.set(Math.cos(a) * 27, 0.7, Math.sin(a) * 27);
  e.userData.speed = 3.2 + Math.random() * 1.6 + score * 0.06;
  e.userData.phase = Math.random() * Math.PI * 2;
  scene.add(e);
  enemies.push(e);
}

const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
function updateHUD() {
  scoreEl.textContent = score;
  livesEl.textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives));
}

/* ---------- Керування ---------- */
const keys = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

let pointerActive = false;
let pointerTarget = null;
const raycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const ndc = new THREE.Vector2();
const hitPoint = new THREE.Vector3();

function setPointer(x, y) {
  ndc.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  if (raycaster.ray.intersectPlane(groundPlane, hitPoint)) {
    pointerTarget = hitPoint.clone();
  }
}

renderer.domElement.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  pointerActive = true;
  setPointer(e.clientX, e.clientY);
  try { renderer.domElement.setPointerCapture(e.pointerId); } catch (_) {}
});
renderer.domElement.addEventListener('pointermove', e => {
  if (pointerActive) setPointer(e.clientX, e.clientY);
});
addEventListener('pointerup', () => { pointerActive = false; pointerTarget = null; });
addEventListener('pointercancel', () => { pointerActive = false; pointerTarget = null; });

/* ---------- Стан гри ---------- */
const overlay = document.getElementById('overlay');
const titleEl = document.getElementById('title');
const textEl = document.getElementById('text');
const btn = document.getElementById('btn');

function reset() {
  gems.forEach(g => scene.remove(g));
  enemies.forEach(e => scene.remove(e));
  gems.length = 0;
  enemies.length = 0;

  score = 0;
  lives = 3;
  invuln = 1.2;
  enemyTimer = 1.5;
  t = 0;

  player.position.set(0, 0.75, 0);
  player.rotation.set(0, 0, 0);
  player.visible = true;
  camera.position.set(0, 15, 16);

  for (let i = 0; i < GEM_COUNT; i++) spawnGem();
  updateHUD();
}

function endGame(won) {
  state = 'over';
  pointerActive = false;
  pointerTarget = null;
  player.visible = true;

  titleEl.textContent = won ? '🏆 Перемога!' : '💥 Гра закінчена';
  textEl.innerHTML = won
    ? `Ти зібрав усі ${WIN_SCORE} кристалів!<br>Залишилось життів: ${lives}`
    : `Ти зібрав ${score} з ${WIN_SCORE} кристалів.`;
  btn.textContent = 'Ще раз';
  overlay.classList.remove('hide');
}

btn.addEventListener('click', () => {
  overlay.classList.add('hide');
  reset();
  state = 'play';
  clock.getDelta();
});

/* ---------- Оновлення ---------- */
function update(dt) {
  t += dt;
  invuln = Math.max(0, invuln - dt);

  /* --- рух гравця --- */
  const dir = new THREE.Vector3();
  if (keys['w'] || keys['arrowup'] || keys['ц'])    dir.z -= 1;
  if (keys['s'] || keys['arrowdown'] || keys['і'])  dir.z += 1;
  if (keys['a'] || keys['arrowleft'] || keys['ф'])  dir.x -= 1;
  if (keys['d'] || keys['arrowright'] || keys['в']) dir.x += 1;

  if (dir.lengthSq() === 0 && pointerActive && pointerTarget) {
    dir.copy(pointerTarget).sub(player.position);
    dir.y = 0;
    if (dir.length() < 0.8) dir.set(0, 0, 0);
  }
  if (dir.lengthSq() > 0) dir.normalize();

  player.position.addScaledVector(dir, SPEED * dt);

  // обмеження арени
  const r = Math.hypot(player.position.x, player.position.z);
  if (r > 23) {
    player.position.x *= 23 / r;
    player.position.z *= 23 / r;
  }
  player.position.y = 0.75 + Math.sin(t * 6) * 0.08;

  // поворот у бік руху
  if (dir.lengthSq() > 0) {
    const targetYaw = Math.atan2(dir.x, dir.z);
    let diff = targetYaw - player.rotation.y;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    player.rotation.y += diff * Math.min(1, dt * 10);
  }

  // мерехтіння після удару
  player.visible = !(invuln > 0 && Math.floor(t * 12) % 2 === 0);

  /* --- кристали --- */
  for (let i = gems.length - 1; i >= 0; i--) {
    const g = gems[i];
    g.rotation.y += dt * 2.2;
    g.rotation.x += dt * 0.8;
    g.position.y = 1.0 + Math.sin(t * 2.5 + g.userData.phase) * 0.2;

    if (g.position.distanceTo(player.position) < 1.4) {
      scene.remove(g);
      gems.splice(i, 1);
      score++;
      updateHUD();
      spawnGem();
      if (score >= WIN_SCORE) { endGame(true); return; }
    }
  }

  /* --- вороги --- */
  enemyTimer -= dt;
  if (enemyTimer <= 0 && enemies.length < MAX_ENEMIES) {
    enemyTimer = 3.5;
    spawnEnemy();
  }

  for (const e of enemies) {
    const d = new THREE.Vector3(
      player.position.x - e.position.x, 0, player.position.z - e.position.z
    );
    const dist = d.length();
    if (dist > 0.001) d.divideScalar(dist);

    e.position.addScaledVector(d, e.userData.speed * dt);
    e.position.y = 0.7 + Math.sin(t * 4 + e.userData.phase) * 0.12;
    e.rotation.y += dt * 2;
    e.rotation.x += dt * 1.3;

    if (dist < 1.4 && invuln <= 0) {
      lives--;
      invuln = 2.2;
      updateHUD();
      e.position.addScaledVector(d, -4); // відкидаємо ворога
      if (lives <= 0) { endGame(false); return; }
    }
  }

  /* --- камера --- */
  const camTarget = new THREE.Vector3(player.position.x, 0, player.position.z);
  const desired = camTarget.clone().add(new THREE.Vector3(0, 15, 15));
  camera.position.lerp(desired, Math.min(1, dt * 3.5));
  camera.lookAt(camTarget.x, 1.2, camTarget.z);
}

/* ---------- Головний цикл ---------- */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (state === 'play') {
    update(dt);
  } else {
    t += dt;
    for (const g of gems) {
      g.rotation.y += dt * 1.6;
      g.position.y = 1.0 + Math.sin(t * 2.5 + g.userData.phase) * 0.2;
    }
    if (state === 'start') {
      player.rotation.y += dt * 0.8;
      player.visible = true;
      camera.lookAt(player.position.x, 1.2, player.position.z);
    }
  }

  renderer.render(scene, camera);
}

/* ---------- Старт ---------- */
reset();
animate();
</script>
</body>
</html>
